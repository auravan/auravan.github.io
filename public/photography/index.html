<p>2025年12月我回到初中母校，见到了阔别多年的，看我从小长大的美术老师廖茂桥，他教授书法，篆刻，国画，陶艺。他的<a href="https://tuchong.com/311685/">摄像作品</a>多在章旦乡拍摄。我直观理解了生活中不缺少美，而缺乏发现美的眼睛这件事。短暂的重逢，他带我看了很多<a href="https://space.bilibili.com/1006125507">ThomasHeaton</a>的纪录片。等缪老师退休之后我应该有机会和他一起出门走走。</p>
