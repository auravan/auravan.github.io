<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 爵士实验室 · 动态 Sus 模块</title>
    <style>
        :root {
            --bg-color: #050505; --disk-height: 52px; --note-width: 110px; 
            --color-root: #ffcc00; --color-3rd: #ffffff; --color-5th: #aaa; --color-7th: #00ffcc; 
            --color-ext: #ff4488; --glow-root: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        body { background-color: var(--bg-color); color: white; margin: 0; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; user-select: none; }
        
        .panel-container { position: absolute; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 25px; box-sizing: border-box; pointer-events: none; z-index: 1000; }
        .menu-group { background: rgba(15, 15, 15, 0.92); border: 1px solid #333; border-radius: 12px; padding: 12px; display: grid; gap: 6px; pointer-events: auto; backdrop-filter: blur(15px); align-self: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .chord-grid { grid-template-columns: repeat(2, 90px); max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .chord-grid::-webkit-scrollbar { width: 4px; }
        .chord-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        .sub-menu { display: flex; gap: 4px; margin-top: 5px; }
        .sub-btn { flex: 1; padding: 6px; font-size: 0.6rem; background: #111; border: 1px solid #333; color: #666; cursor: pointer; border-radius: 4px; }
        .sub-btn.active { border-color: var(--color-ext); color: #fff; background: #221111; }

        .mode-selector { display: flex; background: #000; border-radius: 6px; padding: 3px; margin-bottom: 8px; border: 1px solid #444; }
        .mode-btn { flex: 1; padding: 8px; border: none; background: none; color: #444; font-size: 0.65rem; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #222; color: var(--color-7th); }

        label { padding: 9px; border-radius: 6px; cursor: pointer; font-size: 0.65rem; text-align: center; border: 1px solid #222; background: #111; color: #555; transition: 0.2s; white-space: nowrap; }
        label.selected { border-color: var(--color-root); color: #fff; background: #222; }

        #viewport { width: 100vw; height: 100vh; perspective: 1500px; display: flex; align-items: center; justify-content: center; }
        #world { position: relative; transform-style: preserve-3d; transform: rotateX(-10deg); height: 450px; }
        .ring { position: absolute; width: 0; height: var(--disk-height); transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; }
        .note-panel { position: absolute; width: var(--note-width); height: var(--disk-height); left: calc(var(--note-width)/-2); background: rgba(8,8,8,0.95); border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; backface-visibility: hidden; border-radius: 3px; }
        .note-panel.hit { background: #fff !important; color: #000 !important; transition: 0s; }
        #guide { position: absolute; width: calc(var(--note-width) + 24px); border: 2px solid var(--color-root); left: -68px; top: -5px; transform: translateZ(265px); border-radius: 6px; pointer-events: none; box-shadow: var(--glow-root); opacity: 0.4; transition: height 0.6s, top 0.6s; }
    </style>
</head>
<body>
    <div class="panel-container">
        <div class="left-panel">
            <div class="menu-group chord-grid" id="chordMenu"></div>
            <div class="menu-group">
                <div style="font-size: 0.5rem; color: #555; margin-bottom: 2px;">SUS MODIFIER</div>
                <div class="sub-menu">
                    <button class="sub-btn" id="sNone" onclick="setSus('none')">NONE</button>
                    <button class="sub-btn" id="s2" onclick="setSus('sus2')">SUS 2</button>
                    <button class="sub-btn" id="s4" onclick="setSus('sus4')">SUS 4</button>
                </div>
            </div>
            <div class="menu-group" id="invMenu" style="grid-template-columns: repeat(2, 90px);"></div>
        </div>
        <div class="menu-group">
            <div class="mode-selector">
                <button class="mode-btn active" id="mS" onclick="setMode('Single')">SINGLE</button>
                <button class="mode-btn" id="mC" onclick="setMode('Chord')">CHORD</button>
            </div>
            <div style="font-size: 0.5rem; color: #555; text-align: center; letter-spacing: 2px;">DYNAMIC VOICING V48</div>
        </div>
    </div>
    <div id="viewport"><div id="world"><div id="guide"></div></div></div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const chromatic = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
    const fifths = ["C", "G", "D", "A", "E", "B", "Gb", "Db", "Ab", "Eb", "Bb", "F"];
    
    // 0=C, 1=G, 2=D, 3=A, 4=E, 5=B, 6=Gb, 7=Db, 8=Ab, 9=Eb, 10=Bb, 11=F
    const baseChords = { 
        "Maj7": [0, 4, 1, 5], 
        "m7": [0, 9, 1, 10], 
        "Dom7": [0, 4, 1, 10], 
        "6/9": [0, 4, 1, 3, 2], 
        "m9": [0, 9, 1, 10, 2], 
        "7alt": [0, 4, 10, 9, 8], // 按照你的校准：R 3 b7 #9 b13
        "7#11": [0, 4, 1, 10, 6], 
        "dim7": [0, 9, 6, 3], 
        "mM7": [0, 9, 1, 5]
    };
    
    let state = { chord: "Maj7", inv: 0, rot: 0, mode: "Single", sus: "none" };
    let isDragging = false, startDragX = 0, hasMoved = false;

    function setMode(m) { 
        state.mode = m; 
        document.getElementById('mS').className = m==='Single'?'mode-btn active':'mode-btn';
        document.getElementById('mC').className = m==='Chord'?'mode-btn active':'mode-btn';
    }

    function setSus(type) {
        state.sus = type;
        ['sNone', 's2', 's4'].forEach(id => document.getElementById(id).classList.remove('active'));
        document.getElementById(type === 'none' ? 'sNone' : type === 'sus2' ? 's2' : 's4').classList.add('active');
        update();
        play();
    }

    // 获取动态修改后的偏移量
    function getModifiedOffsets() {
        let offsets = [...baseChords[state.chord]];
        if (state.sus !== 'none') {
            // 找到三音的位置（通常在索引 1 的位置）
            // 在我们的结构中，三音层是层级 1 (r=1)
            if (state.sus === 'sus4') offsets[1] = 11; // 替换为 F
            if (state.sus === 'sus2') offsets[1] = 2;  // 替换为 D
        }
        return offsets;
    }

    function getActiveRingsInfo() {
        const offs = getModifiedOffsets();
        let activeIds = offs.map((off, i) => off !== null ? i : null).filter(x => x !== null);
        const invShift = state.inv % activeIds.length;
        const reorderedIds = [...activeIds.slice(invShift), ...activeIds.slice(0, invShift)];
        let idToVPos = {};
        reorderedIds.forEach((id, index) => { idToVPos[id] = index; });
        return { activeIds, reorderedIds, idToVPos };
    }

    function getFreqs() {
        const { reorderedIds, idToVPos } = getActiveRingsInfo();
        const offs = getModifiedOffsets();
        let res = {}; let lastM = 0;
        reorderedIds.forEach((id, i) => {
            const name = fifths[(Math.round(state.rot/30) + offs[id] + 1200) % 12];
            const sIdx = chromatic.indexOf(name);
            let m;
            if (i === 0) m = 48 + sIdx;
            else { m = lastM + 1; while (m % 12 !== sIdx) m++; }
            lastM = m;
            res[id] = 440 * Math.pow(2, (m - 69) / 12);
        });
        return { res, idToVPos };
    }

    function play(id = null, el = null) {
        const { res, idToVPos } = getFreqs();
        if (state.mode === "Chord") {
            Object.keys(res).forEach(rid => trigger(res[rid], idToVPos[rid]===0, 1.4));
            if(id !== null && res[id]) trigger(res[id], false, 1.6, 0.1);
        } else if (id !== null && res[id]) {
            trigger(res[id], idToVPos[id]===0, 1.6);
        }
        if(el) { el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 120); }
    }

    function trigger(f, b, d, ex=0) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = b ? 'sine' : 'triangle';
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime((b?0.3:0.08)+ex, audioCtx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime+d);
    }

    function update() {
        const { idToVPos, activeIds } = getActiveRingsInfo();
        const offs = getModifiedOffsets();
        document.querySelectorAll('label').forEach(l => l.className = '');
        document.getElementById('c-'+state.chord).classList.add('selected');
        const maxInv = activeIds.length - 1;
        if (state.inv > maxInv) state.inv = 0;
        document.getElementById('i-'+state.inv).classList.add('selected');
        
        for(let r=0; r<6; r++) {
            const rg = document.getElementById('r-'+r);
            if (offs[r] === undefined || offs[r] === null) { 
                rg.style.opacity = 0; rg.style.pointerEvents = 'none';
            } else {
                rg.style.opacity = 1; rg.style.pointerEvents = 'auto';
                rg.style.top = (idToVPos[r] * 65) + 'px';
                rg.style.transform = `rotateY(${-(state.rot + offs[r]*30)}deg)`;
                // 颜色逻辑：如果被 Sus 修改了，三音层变色提示
                let c = r===0?'var(--color-root)':r===1?(state.sus!=='none'?'#00aaff':'var(--color-3rd)'):r===2?'var(--color-5th)':r===3?'var(--color-7th)':'var(--color-ext)';
                rg.querySelectorAll('.note-panel').forEach(p => p.style.color = c);
            }
        }
        document.getElementById('guide').style.height = (activeIds.length * 65 - 8) + 'px';
    }

    function init() {
        const cM = document.getElementById('chordMenu');
        Object.keys(baseChords).forEach(k => {
            const l = document.createElement('label'); l.innerText = k; l.id = 'c-'+k;
            l.onclick = () => { state.chord = k; state.inv = 0; update(); play(); };
            cM.appendChild(l);
        });
        const iM = document.getElementById('invMenu');
        ["Root", "1st", "2nd", "3rd", "4th"].forEach((n, i) => {
            const l = document.createElement('label'); l.innerText = n; l.id = 'i-'+i;
            l.onclick = () => { state.inv = i; update(); play(); };
            iM.appendChild(l);
        });
        const w = document.getElementById('world');
        for (let r=0; r<6; r++) {
            const rg = document.createElement('div'); rg.className = 'ring'; rg.id = 'r-'+r;
            fifths.forEach((n, i) => {
                const p = document.createElement('div'); p.className = 'note-panel'; p.innerText = n;
                p.style.transform = `rotateY(${i*30}deg) translateZ(250px)`;
                rg.appendChild(p);
            });
            w.appendChild(rg);
        }
        window.addEventListener('mousedown', e => { if(e.target.closest('.menu-group')) return; isDragging = true; startDragX = e.clientX; hasMoved = false; });
        window.addEventListener('mousemove', e => {
            if(!isDragging) return;
            let diff = e.clientX - startDragX;
            if(Math.abs(diff) > 5) {
                hasMoved = true;
                const offs = getModifiedOffsets();
                for(let r=0; r<6; r++) {
                    const rg = document.getElementById('r-'+r);
                    if(offs[r] !== null) {
                        rg.style.transition = 'none';
                        rg.style.transform = `rotateY(${-(state.rot + offs[r]*30) + diff*0.4}deg)`;
                    }
                }
            }
        });
        window.addEventListener('mouseup', e => {
            if (!isDragging) return;
            if (!hasMoved) {
                const panel = e.target.closest('.note-panel');
                if (panel) {
                    const ringId = parseInt(panel.parentElement.id.split('-')[1]);
                    play(ringId, panel);
                }
            } else {
                let diff = e.clientX - startDragX;
                state.rot -= Math.round(diff*0.4/30)*30;
            }
            isDragging = false; 
            document.querySelectorAll('.ring').forEach(r => r.style.transition = '');
            update();
        });
        setSus('none');
    }
    init();
</script>
</body>
</html>
